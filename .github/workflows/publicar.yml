# CI em todo push e pull request. Publicação em public_html/semreservas/ só a
# partir da main. Segurança do deploy:
#  - só ENVIA (sem --delete) e só dentro de public_html/semreservas/;
#  - na main, publica de verdade apenas se a variável do repositório
#    DEPLOY_REAL for "true"; do contrário roda em SIMULAÇÃO (lista, não envia).
name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular: lista o que subiria, sem enviar"
        type: boolean
        default: true

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVIDOR: 89.116.115.238
  PORTA: "65002"
  USUARIO: u967848854
  DESTINO: /home/u967848854/domains/umandigital.com.br/public_html/semreservas

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Gerador de placas (testes)
        working-directory: tools/placas
        run: npm ci && npm test
      - name: Testes de isolamento do banco e do gerador
        run: |
          command -v psql >/dev/null || sudo apt-get install -y postgresql
          apps/api/run-tests.sh
      - name: Tipos, testes e build do consumidor
        working-directory: apps/consumidor
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_DEFAULT_TENANT: gastropub
          BASE_PATH: /semreservas/
        run: |
          npm ci
          npm test
          npm run build
      - name: Lista de arquivos retirados (validação e testes)
        run: |
          tools/validar-retirados.test.sh
          tools/validar-retirados.sh deploy/retirados.txt
      - name: Nenhuma chave secreta no pacote publicado
        run: |
          node --test tools/verificar-pacote.test.mjs
          node tools/verificar-pacote.mjs apps/consumidor/dist
      - uses: actions/upload-artifact@v4
        with: { name: site, path: apps/consumidor/dist, include-hidden-files: true }

  publicar:
    needs: testar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            tools
      - uses: actions/download-artifact@v4
        with: { name: site, path: site }
      - name: Preparar a chave
        env:
          CHAVE: ${{ secrets.SSH_CHAVE_PRIVADA }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Tolerante a colagem pelo Windows: tira BOM, CR e espaços nas pontas das linhas,
          # descarta linhas vazias e garante a quebra final.
          printf '%s\n' "$CHAVE" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            # Diagnóstico SEM o conteúdo da chave: só a estrutura.
            echo "linhas: $(wc -l < ~/.ssh/id_ed25519)  bytes: $(wc -c < ~/.ssh/id_ed25519)"
            echo "primeira linha: $(head -1 ~/.ssh/id_ed25519 | cut -c1-40)"
            echo "última linha:   $(tail -1 ~/.ssh/id_ed25519 | cut -c1-40)"
            echo "tamanhos das linhas: $(awk '{printf "%d ", length($0)}' ~/.ssh/id_ed25519)"
            echo "caracteres não-ASCII: $(LC_ALL=C grep -c -P '[^\x00-\x7F]' ~/.ssh/id_ed25519 || true)"
            echo "::error::SSH_CHAVE_PRIVADA não é uma chave privada válida. Veja a estrutura acima."
            exit 1
          fi
          ssh-keyscan -p "$PORTA" "$SERVIDOR" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "::error::servidor não respondeu ao ssh-keyscan."; exit 1; }
      - name: Testar o acesso e o destino
        run: |
          ssh -p "$PORTA" -o StrictHostKeyChecking=yes -o BatchMode=yes "$USUARIO@$SERVIDOR" \
            "test -d '$DESTINO'" \
            || { echo "::error::acesso recusado, ou a pasta $DESTINO não existe (crie public_html/semreservas no hPanel)."; exit 1; }
      - name: Enviar
        run: |
          SECO=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.simular }}" = "true" ] && SECO="--dry-run"
          else
            [ "${{ vars.DEPLOY_REAL }}" = "true" ] || SECO="--dry-run"
          fi
          echo "SECO=$SECO" >> "$GITHUB_ENV"
          [ -n "$SECO" ] && echo "::notice::SIMULAÇÃO — nada será enviado de verdade"
          rsync -rltz --checksum --human-readable --itemize-changes $SECO \
            --no-perms --no-owner --no-group \
            -e "ssh -p $PORTA -o StrictHostKeyChecking=yes" \
            site/ "$USUARIO@$SERVIDOR:$DESTINO/"
      # O envio acima nunca apaga nada. Quando um arquivo SAI do app (ex.: um prato 3D retirado), ele fica no servidor.
      # Esta etapa apaga SOMENTE os arquivos listados em deploy/retirados.txt, e só dentro de media/ (o validador
      # recusa qualquer outro caminho). Em simulação, só lista.
      - name: Remover do servidor os arquivos retirados
        run: |
          tools/validar-retirados.sh deploy/retirados.txt > retirados-validos.txt
          while IFS= read -r f; do
            if [ -n "$SECO" ]; then echo "SIMULAÇÃO: removeria $DESTINO/$f"; continue; fi
            ssh -n -p "$PORTA" -o StrictHostKeyChecking=yes "$USUARIO@$SERVIDOR" "rm -f -- '$DESTINO/$f'" && echo "removido (se existia): $f"   # -n: sem ele o ssh engole o resto da lista
          done < retirados-validos.txt
          echo "processados: $(wc -l < retirados-validos.txt) arquivo(s) da lista"
